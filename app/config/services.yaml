parameters:
    frontend_url: '%env(FRONTEND_URL)%'
    mailer_from: '%env(MAILER_FROM)%'
    chat_ws_bind: '0.0.0.0'
    chat_ws_port: 8080

    # Business/polling knobs (override per-environment as needed).
    pending_order_ttl_minutes: 15
    seat_cache_ttl_seconds: 30
    outbox_relay_interval_seconds: 10

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            Symfony\Component\Messenger\MessageBusInterface $commandBus: '@command.bus'
            Symfony\Component\Messenger\MessageBusInterface $queryBus: '@query.bus'
            Symfony\Component\Messenger\MessageBusInterface $eventBus: '@event.bus'
            string $frontendUrl: '%frontend_url%'
            string $mailerFrom: '%mailer_from%'
            string $chatWsBind: '%env(default:chat_ws_bind:string:CHAT_WS_BIND)%'
            int $chatWsPort: '%env(default:chat_ws_port:int:CHAT_WS_PORT)%'
            int $pendingOrderTtlMinutes: '%pending_order_ttl_minutes%'
            int $ttlSeconds: '%seat_cache_ttl_seconds%'
            int $outboxRelayIntervalSeconds: '%outbox_relay_interval_seconds%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'
            - '../src/Application/Dto/'
            - '../src/Application/Event/'
            - '../src/Application/Command/'
            - '../src/Application/Query/'
            - '../src/Infrastructure/Cache/'
            - '../src/Kernel.php'

    App\Application\Dto\Factory\:
        resource: '../src/Application/Dto/Factory/'

    Symfony\Bundle\SecurityBundle\Security:
        alias: security.helper
        public: true

    Doctrine\Bundle\FixturesBundle\Loader\SymfonyFixturesLoader:
        alias: doctrine.fixtures.loader

    App\Application\Command\CommandBusInterface:
        class: App\Infrastructure\Messenger\MessengerCommandBus

    App\Application\Query\QueryBusInterface:
        class: App\Infrastructure\Messenger\MessengerQueryBus

    App\Application\MessageHandler\PublishOutboxMessagesHandler:
        arguments:
            $eventsTransport: '@messenger.transport.events'

    App\Application\Transaction\TransactionManagerInterface:
        class: App\Infrastructure\Doctrine\DoctrineTransactionManager

    App\Application\Port\PasswordHasherInterface:
        class: App\Infrastructure\Security\SymfonyPasswordHasher

    App\Application\Port\OrderReadRepositoryInterface:
        class: App\Infrastructure\ReadModel\DoctrineOrderReadRepository

    App\Application\Port\PaymentReadRepositoryInterface:
        class: App\Infrastructure\ReadModel\DoctrinePaymentReadRepository

    App\Application\Port\TicketVerificationReadRepositoryInterface:
        class: App\Infrastructure\ReadModel\DoctrineTicketVerificationRepository

    App\Application\Port\SeatAvailabilityReadRepositoryInterface:
        class: App\Infrastructure\ReadModel\DoctrineSeatAvailabilityRepository

    App\Domain\Shared\ClockInterface:
        class: App\Infrastructure\Shared\SystemClock

    App\Domain\Shared\IdGeneratorInterface:
        class: App\Infrastructure\Shared\UuidGenerator

    App\Application\Port\EventSearchInterface:
        class: App\Infrastructure\Elasticsearch\ElasticsearchEventSearchService

    App\Application\Port\AnalyticsRepositoryInterface:
        class: App\Infrastructure\ClickHouse\ClickHouseAnalyticsRepository

    App\Domain\Repository\OutboxMessageRepositoryInterface:
        class: App\Infrastructure\Doctrine\Repository\DoctrineOutboxMessageRepository

    App\Application\Port\EventReadRepositoryInterface:
        class: App\Infrastructure\ReadModel\DoctrineEventReadRepository

    App\Application\Cache\SeatAvailabilityCacheInterface:
        class: App\Infrastructure\Cache\RedisSeatAvailabilityCache
        arguments:
            $cache: '@cache.seat_availability'

    App\Application\Port\ChatRoomReadRepositoryInterface:
        class: App\Infrastructure\ReadModel\DoctrineChatReadRepository

    App\Domain\Service\ChatAccessPolicy: ~

    App\Infrastructure\Controller\Api\Admin\VerifyTicketController:
        arguments:
            $cache: '@cache.app'

    App\Domain\Repository\UserRepositoryInterface:
        class: App\Infrastructure\Doctrine\Repository\DoctrineUserRepository

    App\Domain\Repository\EventRepositoryInterface:
        class: App\Infrastructure\Doctrine\Repository\DoctrineEventRepository

    App\Domain\Repository\VenueRepositoryInterface:
        class: App\Infrastructure\Doctrine\Repository\DoctrineVenueRepository

    App\Domain\Repository\SeatRepositoryInterface:
        class: App\Infrastructure\Doctrine\Repository\DoctrineSeatRepository

    App\Domain\Repository\EventSeatRepositoryInterface:
        class: App\Infrastructure\Doctrine\Repository\DoctrineEventSeatRepository

    App\Domain\Repository\OrderRepositoryInterface:
        class: App\Infrastructure\Doctrine\Repository\DoctrineOrderRepository

    App\Domain\Repository\TicketRepositoryInterface:
        class: App\Infrastructure\Doctrine\Repository\DoctrineTicketRepository

    App\Domain\Repository\PaymentRepositoryInterface:
        class: App\Infrastructure\Doctrine\Repository\DoctrinePaymentRepository

    App\Domain\Repository\ChatRoomRepositoryInterface:
        class: App\Infrastructure\Doctrine\Repository\DoctrineChatRoomRepository

    App\Domain\Repository\ChatMessageRepositoryInterface:
        class: App\Infrastructure\Doctrine\Repository\DoctrineChatMessageRepository

    App\Infrastructure\Elasticsearch\ClientFactory:
        arguments:
            $hosts: '%env(json:ELASTICSEARCH_HOSTS)%'

    Elastic\Elasticsearch\Client:
        factory: ['@App\Infrastructure\Elasticsearch\ClientFactory', 'create']

    ClickHouseDB\Client:
        arguments:
            $connectParams:
                host: '%env(string:CLICKHOUSE_HOST)%'
                port: '%env(int:CLICKHOUSE_PORT)%'
                username: '%env(string:CLICKHOUSE_USER)%'
                password: '%env(string:CLICKHOUSE_PASSWORD)%'
                timeout: 10
            $settings:
                database: '%env(string:CLICKHOUSE_DB)%'
