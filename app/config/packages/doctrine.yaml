doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        types:
            user_id: 'App\Infrastructure\Doctrine\DBAL\Types\UserIdType'
            chat_message_id: 'App\Infrastructure\Doctrine\DBAL\Types\ChatMessageIdType'
            chat_room_id: 'App\Infrastructure\Doctrine\DBAL\Types\ChatRoomIdType'
            event_id: 'App\Infrastructure\Doctrine\DBAL\Types\EventIdType'
            ticket_id: 'App\Infrastructure\Doctrine\DBAL\Types\TicketIdType'
            seat_id: 'App\Infrastructure\Doctrine\DBAL\Types\SeatIdType'
            venue_id: 'App\Infrastructure\Doctrine\DBAL\Types\VenueIdType'
            payment_id: 'App\Infrastructure\Doctrine\DBAL\Types\PaymentIdType'
            order_id: 'App\Infrastructure\Doctrine\DBAL\Types\OrderIdType'
            event_seat_id: 'App\Infrastructure\Doctrine\DBAL\Types\EventSeatIdType'
            message_text: 'App\Infrastructure\Doctrine\DBAL\Types\MessageTextType'
            name: 'App\Infrastructure\Doctrine\DBAL\Types\NameType'
            email: 'App\Infrastructure\Doctrine\DBAL\Types\EmailType'
            event_title: 'App\Infrastructure\Doctrine\DBAL\Types\EventTitleType'
            event_description: 'App\Infrastructure\Doctrine\DBAL\Types\EventDescriptionType'
            venue_address: 'App\Infrastructure\Doctrine\DBAL\Types\VenueAddressType'
            venue_city: 'App\Infrastructure\Doctrine\DBAL\Types\VenueCityType'
            venue_name: 'App\Infrastructure\Doctrine\DBAL\Types\VenueNameType'
            seat_row: 'App\Infrastructure\Doctrine\DBAL\Types\SeatRowType'
            seat_number: 'App\Infrastructure\Doctrine\DBAL\Types\SeatNumberType'
            seat_sector: 'App\Infrastructure\Doctrine\DBAL\Types\SeatSectorType'
            ticket_code: 'App\Infrastructure\Doctrine\DBAL\Types\TicketCodeType'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Doctrine/Mapping/ORM'
                prefix: 'App\Domain\Entity'
                alias: App
            AppValueObject:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Doctrine/Mapping/ValueObject'
                prefix: 'App\Domain\ValueObject'
                alias: AppValueObject

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
