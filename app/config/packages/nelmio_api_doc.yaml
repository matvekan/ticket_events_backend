nelmio_api_doc:
    documentation:
        info:
            title: 'Ticket Events API'
            description: 'API documentation for Ticket Events Backend'
            version: '1.0.0'
        components:
            securitySchemes:
                BearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - BearerAuth: []
    areas:
        default:
            path_patterns:
                - ^/api
            host_patterns:
                - ^api\.
    models:
        - { name: 'App\Application\Dto\EventDto', alias: 'Event' }
        - { name: 'App\Application\Dto\EventDetailsDto', alias: 'EventDetails' }
        - { name: 'App\Application\Dto\OrderDto', alias: 'Order' }
        - { name: 'App\Application\Dto\PaymentDto', alias: 'Payment' }
        - { name: 'App\Application\Dto\TicketDto', alias: 'Ticket' }
        - { name: 'App\Application\Dto\TicketVerificationDto', alias: 'TicketVerification' }
        - { name: 'App\Application\Dto\VenueDto', alias: 'Venue' }
        - { name: 'App\Application\Dto\SeatDto', alias: 'Seat' }
        - { name: 'App\Application\Dto\ChatRoomDto', alias: 'ChatRoom' }
        - { name: 'App\Application\Dto\ChatMessageDto', alias: 'ChatMessage' }
        - { name: 'App\Application\Dto\Analytics\AnalyticsTotalsDto', alias: 'AnalyticsTotals' }
        - { name: 'App\Application\Dto\Analytics\TableTotalsDto', alias: 'TableTotals' }
        - { name: 'App\Application\Dto\Analytics\AnalyticsByDayDto', alias: 'AnalyticsByDay' }
        - { name: 'App\Application\Dto\Analytics\TopUserDto', alias: 'TopUser' }
        - { name: 'App\Application\Dto\Analytics\RecentPaymentDto', alias: 'RecentPayment' }