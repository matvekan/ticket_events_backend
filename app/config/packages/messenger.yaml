framework:
    messenger:
        default_bus: command.bus

        buses:
            command.bus:
                middleware:
                    - validation
            query.bus:
                middleware:
                    - validation
            event.bus:
                default_middleware: allow_no_handlers

        transports:
            sync: 'sync://'
            scheduler_default:
                dsn: 'schedule://default'
                retry_strategy:
                    max_retries: 0
            events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN_EVENTS)%'
                options:
                    auto_setup: true
        routing:
            # Domain events are written straight to the outbox table by the
            # transaction manager and relayed to the `events` transport —
            # they are NOT dispatched through buses, so no routing here.
            'App\Application\Message\SendPasswordResetEmail': events
