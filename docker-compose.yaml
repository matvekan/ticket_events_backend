networks:
  ticket_network:
    name: ticketNetwork

volumes:
  pg-data:
  vendor-data:

services:
  nginx:
    container_name: tick_nginx
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./app:/var/www
    depends_on:
      php:
        condition: service_healthy
    networks:
      - ticket_network

  php:
    container_name: tick_php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./app:/var/www
      - vendor-data:/var/www/vendor
    command: ["sh", "-c", "if [ ! -f config/jwt/private.pem ]; then php bin/console lexik:jwt:generate-keypair -q; fi; exec php-fpm"]
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1','9000') ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ticket_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: tick-postgres
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - ticket_network

  redis:
    container_name: tick_redis
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - ticket_network

  rabbitmq:
    container_name: tick_rabbitmq
    image: rabbitmq:3-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ticket_network

  elasticsearch:
    container_name: tick_es
    image: elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    ports:
      - "9200:9200"
    networks:
      - ticket_network

  worker:
    container_name: tick_worker
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./app:/var/www
      - vendor-data:/var/www/vendor
    command: php bin/console messenger:consume events scheduler_default -vv --time-limit=3600
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - ticket_network

  chat:
    container_name: tick_chat
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./app:/var/www
      - vendor-data:/var/www/vendor
    command: php bin/console app:chat-server
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - ticket_network

  clickhouse:
    container_name: tick_clickhouse
    image: clickhouse/clickhouse-server:24.8.4.13
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "clickhouse-client", "-q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - ticket_network